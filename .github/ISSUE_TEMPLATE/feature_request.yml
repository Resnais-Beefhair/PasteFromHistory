name: Feature request
description: Describe a useful change in English.
title: '[Feature] '
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who benefits.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain what the user would see or do. Alternatives are welcome.
    validations:
      required: true
